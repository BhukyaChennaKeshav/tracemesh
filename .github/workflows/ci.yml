name: Validate TraceMesh

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet

  maven-build:
    name: Build Java services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build Spring Boot producer
        run: mvn --batch-mode --no-transfer-progress -f trace-producer/pom.xml clean verify
      - name: Build Spark streaming job
        run: mvn --batch-mode --no-transfer-progress -f spark-streaming-job/pom.xml clean verify

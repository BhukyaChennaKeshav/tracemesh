version: '3.8'

networks:
  tracemesh-net:
    driver: bridge

volumes:
  kafka_data:
  hadoop_namenode:
  hadoop_datanode:
  postgres_hive_data:

services:
  # 1. Message Broker (Kafka KRaft)
  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - tracemesh-net

  # 2. Spark Master
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - tracemesh-net

  # 3. Spark Worker
  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - tracemesh-net

  # 4. Storage (Hadoop HDFS NameNode)
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870"
    environment:
      - CLUSTER_NAME=tracemesh
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - tracemesh-net

  # 5. Storage (Hadoop HDFS DataNode)
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - CLUSTER_NAME=tracemesh
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - tracemesh-net

  # 6. Hive Metastore DB (PostgreSQL)
  hive-metastore-postgresql:
    image: postgres:13
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
    volumes:
      - postgres_hive_data:/var/lib/postgresql/data
    networks:
      - tracemesh-net
# 7. Trace Producer App (Role 1)
  trace-producer:
    build:
      context: ./trace-producer
    container_name: trace-producer
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    restart: on-failure
    networks:
      - tracemesh-net

  # 8. Spark Streaming Job (Role 2)
  spark-streaming-app:
    build:
      context: ./spark-streaming-job
    container_name: spark-streaming-app
    depends_on:
      - kafka
      - namenode
      - spark-master
    restart: on-failure
    networks:
      - tracemesh-net
# 9. Apache Hive Server
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-db/metastore_db"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-db/metastore_db"
    ports:
      - "10000:10000"
    volumes:
      - ./hive-warehouse:/workspace
    networks:
      - tracemesh-net
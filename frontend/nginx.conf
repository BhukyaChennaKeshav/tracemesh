server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve trace-producer per request via Docker's DNS, so nginx still starts
    # (and recovers) while the producer is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://trace-producer:8081;

    # Server-sent events: no buffering, long-lived connection
    location = /api/stream {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # Hive queries can run MapReduce stages
        proxy_read_timeout 120s;
    }

    # Client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
